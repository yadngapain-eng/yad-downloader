plugins { id 'com.android.application' }

android {
    namespace 'com.yad.videodl'
    compileSdk 34

    defaultConfig {
        applicationId "com.yad.videodl"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "2.0.0"
        multiDexEnabled true

        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES','META-INF/LICENSE',
                         'META-INF/LICENSE.txt','META-INF/NOTICE',
                         'META-INF/NOTICE.txt','META-INF/INDEX.LIST']
        }
        jniLibs { useLegacyPackaging = true }
    }

    aaptOptions { noCompress 'zip', 'jar', 'mp4' }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.multidex:multidex:2.0.1'

    // youtubedl-android — bundle Python + yt-dlp + ffmpeg
    implementation 'io.github.junkfood02.youtubedl-android:library:0.17.4'
    implementation 'io.github.junkfood02.youtubedl-android:ffmpeg:0.17.4'
}
