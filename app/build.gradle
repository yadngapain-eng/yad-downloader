plugins { id 'com.android.application' }

android {
    namespace 'com.yad.videodl'
    compileSdk 34

    defaultConfig {
        applicationId "com.yad.videodl"
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName "3.0.0"
        multiDexEnabled true
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES','META-INF/LICENSE',
                         'META-INF/LICENSE.txt','META-INF/NOTICE',
                         'META-INF/NOTICE.txt','META-INF/INDEX.LIST',
                         'META-INF/*.kotlin_module']
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.multidex:multidex:2.0.1'

    // NewPipe Extractor
    implementation 'com.github.TeamNewPipe:NewPipeExtractor:v0.24.4'

    // NanoHTTPD untuk handle download stream
    implementation 'org.nanohttpd:nanohttpd:2.3.1'

    // Untuk OkHttp (dependency NewPipe)
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jsoup:jsoup:1.17.2'
}
